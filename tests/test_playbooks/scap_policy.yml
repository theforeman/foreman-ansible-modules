---
- hosts: localhost
  collections:
    - theforeman.foreman
  gather_facts: false
  vars_files:
    - vars/server.yml
  tasks:
    - include_tasks: tasks/organization.yml
      vars:
        organization_state: "present"
    - include_tasks: tasks/location.yml
      vars:
        location_state: "present"
    - include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "{{ item }}"
        scap_policy_state: "absent"
      loop:
        - scap_policy_name
        - updated_scap_policy_name
    - include_tasks: tasks/scap_content.yml
      vars:
        scap_content_title: "scap_policy_scap_content"
        scap_content_scap_file: "data/ssg-firefox-ds.xml"
        scap_content_original_filename: "ssg-firefox-ds.xml"
        scap_content_locations:
          - Test Location
        scap_content_organizations:
          - Test Organization
        scap_content_state: "present"
    - include_tasks: tasks/scap_tailoring_file.yml
      vars:
        scap_tailoring_file_name: "scap_policy_tailoring_file"
        scap_tailoring_file_scap_file: "data/ssg-firefox-ds-tailoring.xml"
        scap_tailoring_file_original_filename: "ssg-firefox-ds-tailoring.xml"
        scap_tailoring_file_locations:
          - Test Location
        scap_tailoring_file_organizations:
          - Test Organization
        scap_tailoring_file_state: "present"

- hosts: tests
  collections:
    - theforeman.foreman
  gather_facts: false
  vars_files:
    - vars/server.yml
  vars:
    firefox_profile: "Upstream Firefox STIG"
    firefox_tailoring_profile: "Upstream Firefox STIG [CUSTOMIZED]"
  tasks:
    - name: create SCAP policy
      include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "scap_policy_name"
        scap_policy_scap_content: "scap_policy_scap_content"
        scap_policy_scap_content_profile: "{{ firefox_profile }}"
        scap_policy_period: "weekly"
        scap_policy_weekday: "tuesday"
        scap_policy_deploy_by: "manual"
        scap_policy_locations:
          - Test Location
        scap_policy_organizations:
          - Test Organization
        scap_policy_state: "present"
        expected_change: true
    - name: create SCAP policy again, no change
      include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "scap_policy_name"
        scap_policy_scap_content: "scap_policy_scap_content"
        scap_policy_scap_content_profile: "{{ firefox_profile }}"
        scap_policy_period: "weekly"
        scap_policy_weekday: "tuesday"
        scap_policy_deploy_by: "manual"
        scap_policy_locations:
          - Test Location
        scap_policy_organizations:
          - Test Organization
        scap_policy_state: "present"
        expected_change: false
    - name: attach tailoring file to SCAP policy
      include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "scap_policy_name"
        scap_policy_scap_content: "scap_policy_scap_content"
        scap_policy_scap_content_profile: "{{ firefox_profile }}"
        scap_policy_tailoring_file: "scap_policy_tailoring_file"
        scap_policy_tailoring_file_profile: "{{ firefox_tailoring_profile }}"
        scap_policy_period: "weekly"
        scap_policy_weekday: "tuesday"
        scap_policy_deploy_by: "manual"
        scap_policy_locations:
          - Test Location
        scap_policy_organizations:
          - Test Organization
        scap_policy_state: "present"
        expected_change: true
    - name: attach tailoring file to SCAP policy again, no change
      include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "scap_policy_name"
        scap_policy_scap_content: "scap_policy_scap_content"
        scap_policy_scap_content_profile: "{{ firefox_profile }}"
        scap_policy_tailoring_file: "scap_policy_tailoring_file"
        scap_policy_tailoring_file_profile: "{{ firefox_tailoring_profile }}"
        scap_policy_period: "weekly"
        scap_policy_weekday: "tuesday"
        scap_policy_deploy_by: "manual"
        scap_policy_locations:
          - Test Location
        scap_policy_organizations:
          - Test Organization
        scap_policy_state: "present"
        expected_change: false
    - name: rename SCAP policy
      include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "scap_policy_name"
        scap_policy_updated_name: "updated_scap_policy_name"
        scap_policy_scap_content: "scap_policy_scap_content"
        scap_policy_scap_content_profile: "{{ firefox_profile }}"
        scap_policy_tailoring_file: "scap_policy_tailoring_file"
        scap_policy_tailoring_file_profile: "{{ firefox_tailoring_profile }}"
        scap_policy_period: "weekly"
        scap_policy_weekday: "tuesday"
        scap_policy_deploy_by: "manual"
        scap_policy_locations:
          - Test Location
        scap_policy_organizations:
          - Test Organization
        scap_policy_state: "present"
        expected_change: true
    - name: delete SCAP policy
      include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "updated_scap_policy_name"
        scap_policy_state: "absent"
        expected_change: true
    - name: delete SCAP policy again, no change
      include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "updated_scap_policy_name"
        scap_policy_state: "absent"
        expected_change: false

- hosts: localhost
  collections:
    - theforeman.foreman
  gather_facts: false
  vars_files:
    - vars/server.yml
  tasks:
    - include_tasks: tasks/scap_policy.yml
      vars:
        scap_policy_name: "{{ item }}"
        scap_policy_state: "absent"
      loop:
        - scap_policy_name
        - updated_scap_policy_name
    - include_tasks: tasks/scap_tailoring_file.yml
      vars:
        scap_tailoring_file_name: "scap_policy_tailoring_file"
        scap_tailoring_file_state: "absent"
    - include_tasks: tasks/scap_content.yml
      vars:
        scap_content_title: "scap_policy_scap_content"
        scap_content_state: "absent"
    - include_tasks: tasks/location.yml
      vars:
        location_state: "absent"
    - include_tasks: tasks/organization.yml
      vars:
        organization_state: "absent"
