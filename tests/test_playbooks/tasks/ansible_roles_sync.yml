---
- name: "Sync Ansible roles from '{{ ansible_roles_sync_smart_proxy }}'"
  ansible_roles_sync:
    username: "{{ foreman_username }}"
    password: "{{ foreman_password }}"
    server_url: "{{ foreman_server_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    smart_proxy: "{{ ansible_roles_sync_smart_proxy }}"
    roles: "{{ ansible_roles_sync_roles | default(omit) }}"
  register: result
- assert:
    fail_msg: "Syncing Ansible roles failed! (expected_change: {{ expected_change | default('unknown') }})"
    that:
      - result.changed == expected_change
      - result.roles | length == expected_roles
      - ansible_check_mode or not expected_change or result.task.result == 'success'
  when: expected_change is defined
...
