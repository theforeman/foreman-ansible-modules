# Test fail_on_missing behavior

- name: "Create rule for nonexistent module - fail_on_missing false (default) - should skip silently"
  vars:
    content_view_filter_name: "Test Content View Filter - modulemd"
    content_view_name: "Test Content View"
    organization_name: "Test Organization"
    rule_state: present
  content_view_filter_rule:
    username: "{{ foreman_username }}"
    password: "{{ foreman_password }}"
    server_url: "{{ foreman_server_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    organization: "{{ organization_name }}"
    content_view: "{{ content_view_name }}"
    content_view_filter: "{{ content_view_filter_name }}"
    name: "nonexistent_module_xyz"
    fail_on_missing: false
    state: "{{ rule_state }}"
  register: result

- name: "Assert silently skipped"
  ansible.builtin.assert:
    fail_msg: "Module should have been silently skipped for nonexistent module stream"
    that:
      - result is success


- name: "Create rule for nonexistent module - fail_on_missing true - should fail"
  vars:
    content_view_filter_name: "Test Content View Filter - modulemd"
    content_view_name: "Test Content View"
    organization_name: "Test Organization"
    rule_state: present
  content_view_filter_rule:
    username: "{{ foreman_username }}"
    password: "{{ foreman_password }}"
    server_url: "{{ foreman_server_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    organization: "{{ organization_name }}"
    content_view: "{{ content_view_name }}"
    content_view_filter: "{{ content_view_filter_name }}"
    name: "nonexistent_module_xyz"
    fail_on_missing: true
    state: "{{ rule_state }}"
  register: result
  ignore_errors: true

- name: "Assert failed with message"
  ansible.builtin.assert:
    fail_msg: "Module should have failed for nonexistent module stream with fail_on_missing=true"
    that:
      - result is failed
      - "'Could not find any module streams matching' in result.msg"


- name: "Remove nonexistent module - state absent - should skip silently regardless of fail_on_missing"
  vars:
    content_view_filter_name: "Test Content View Filter - modulemd"
    content_view_name: "Test Content View"
    organization_name: "Test Organization"
    rule_state: absent
  content_view_filter_rule:
    username: "{{ foreman_username }}"
    password: "{{ foreman_password }}"
    server_url: "{{ foreman_server_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    organization: "{{ organization_name }}"
    content_view: "{{ content_view_name }}"
    content_view_filter: "{{ content_view_filter_name }}"
    name: "nonexistent_module_xyz"
    fail_on_missing: true
    state: "{{ rule_state }}"
  register: result

- name: "Assert absent skip"
  ansible.builtin.assert:
    fail_msg: "Absent for nonexistent module should succeed silently"
    that:
      - result is success
